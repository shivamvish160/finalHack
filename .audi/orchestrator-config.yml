protected_branches:
  - main
  - master
  - develop
  - trunk
tier_routing:
  enabled: false
sensors:
  timeout_seconds: 60
  fast:
    []
jira:
  enabled: true
  story_key: ''
  comment_on_phase_complete: true
  transition_on_implement: 'In Development'
  transition_on_review: 'In Review'
  transition_on_done: ''
  auto_create_stories: true
  auto_transition_stories: true
  auto_create_subtasks: true
  auto_transition_subtasks: true
  transition_subtask_on_complete: 'Done'
