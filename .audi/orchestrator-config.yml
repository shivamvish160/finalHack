parallel:
  max_concurrency: 3
models:
  primary: auto
  review: ask
verify:
  auto_prompt_install: true
  install_url: ''
subagents:
  enabled: true
  max_concurrency: 2
  review_pipeline: true
  max_review_iterations: 3
  continuous_mode: true
  context_budget: 32000
budgets:
  cost_per_feature_usd: null
  wall_clock_minutes: null
git_checkpoints: true
auto_approve_gates: false
